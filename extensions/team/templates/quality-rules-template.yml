schema: speckit-quality-rules/v1
pack:
  id: project-quality
  version: 1.0.0

# enforcement: required -> failure is NO-GO
#              advisory -> failure is GO-WITH-RISK when no required rule fails
# engine: command | static | external | model-as-judge
rules: []

