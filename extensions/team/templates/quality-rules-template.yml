#   severity: blocker
#   enforcement: required
#   engine: command
#   phases: [implementing, reviewing]
#   command:
#     argv: ["./mvnw", "test"]
#     windows_argv: ["mvnw.cmd", "test"]
#     timeout_seconds: 300

