schema_version: "1.0"

extension:
  id: team
  name: "AI Team SDD Skills"
  version: "0.10.0"
  description: "Project, Feature, Bugfix, review, Knowledge, and Memory skills for enterprise SDD delivery."
  author: AI Team Template
  repository: https://github.com/EuphoriaYan/spec-kit
  license: MIT

requires:
  speckit_version: ">=0.12.4"
  tools:
    - name: gh
      required: false
    - name: codegraph
      version: ">=1.0.0,<2.0.0"
      required: true

provides:
