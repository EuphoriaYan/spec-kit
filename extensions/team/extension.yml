        - source: docs/repository-boundary.md
          target: references/repository-boundary.md
        - source: docs/gitcode-host-contract.md
          target: references/gitcode-host-contract.md
        - source: docs/feature-lifecycle.md
          target: references/feature-lifecycle.md
        - source: templates/requirement-record-template.md
