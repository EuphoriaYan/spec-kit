        - source: scripts/feature_records.py
          target: scripts/feature_records.py
        - source: scripts/architecture_terms.py
          target: scripts/architecture_terms.py
        - source: scripts/check_feature_record.py
          target: scripts/check_feature_record.py
    - name: speckit.team.feature-split
      file: commands/speckit.team.feature-split.md
      description: "Architecture/Product decomposition: review architecture context and create a validated repository Feature Catalog and Feature Records."
